server {
  listen 80;
  root /usr/share/nginx/html;

  # zapytania do API trafiaja do kontenera backend (to samo robi proxy w vite.config.js)
  location /api/ {
    proxy_pass http://backend:3000;
  }

  # React Router: kazda inna sciezka to index.html
  location / {
    try_files $uri /index.html;
  }
}
